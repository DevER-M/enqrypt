[project]
name = "enc"
version = "0.2.0"
description = "Server-hosted 1:1 chat with browser-side post-quantum encryption"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "websockets>=13",
]

[project.scripts]
enc = "enc.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
